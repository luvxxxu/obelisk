# Obelisk — one-shot deployment (Dokploy "Docker Compose" service, or plain `docker compose up -d`).
#
# Only the `web` service needs a public domain. It serves the UI and proxies
# /api, /mcp and /.well-known/* to `backend` over the internal network.
#
# Required env: PUBLIC_URL (e.g. https://obelisk.example.com), POSTGRES_PASSWORD.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: obelisk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: obelisk
    volumes:
      - obelisk-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obelisk -d obelisk"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://obelisk:${POSTGRES_PASSWORD}@db:5432/obelisk
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL to the public URL of the web app, e.g. https://obelisk.example.com}
      SIGNUP_MODE: ${SIGNUP_MODE:-first}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        BACKEND_URL: http://backend:4000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"

volumes:
  obelisk-db:
