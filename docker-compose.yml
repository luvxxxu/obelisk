# Obelisk — production deployment (Dokploy "Docker Compose" service, or plain `docker compose up -d`).
#
# Only the `web` service needs a public domain (Dokploy → Domains → service `web`, port 3000, HTTPS).
# It serves the UI and proxies /api, /mcp and /.well-known/* to `backend` over the internal network.
# Postgres and the API are never published to the host.
#
# Required env: PUBLIC_URL (e.g. https://obelisk.example.com), POSTGRES_PASSWORD.
# Recommended env: SECRET_KEY (openssl rand -base64 32) — seals users' Jev keys; without it only POSTGRES_PASSWORD protects them.
# Optional env: SIGNUP_MODE (first|open|closed, default first), BACKUP_KEEP_DAYS (default 14),
#               SECRET_KEY_PREVIOUS (the old SECRET_KEY while rotating),
#               WEBHOOK_ALLOW_PRIVATE (true lets outgoing webhooks reach LAN/private addresses; default false),
#               SMTP_URL + MAIL_FROM (password reset mails; without SMTP_URL "비밀번호 찾기" is hidden).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: obelisk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: obelisk
    volumes:
      - obelisk-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obelisk -d obelisk"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://obelisk:${POSTGRES_PASSWORD}@db:5432/obelisk
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL to the public URL of the web app, e.g. https://obelisk.example.com}
      SIGNUP_MODE: ${SIGNUP_MODE:-first}
      SECRET_KEY: ${SECRET_KEY:-}
      SECRET_KEY_PREVIOUS: ${SECRET_KEY_PREVIOUS:-}
      WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-false}
      JEV_MODEL: ${JEV_MODEL:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        BACKEND_URL: http://backend:4000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Daily compressed pg_dump into the `obelisk-backups` volume (also runs once on every deploy).
  # Restore: see README → 백업과 복구.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: obelisk
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: obelisk
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - obelisk-backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[backup] daily pg_dump to /backups, keeping $${BACKUP_KEEP_DAYS} days"
        while true; do
          f="/backups/obelisk-$$(date +%Y%m%d-%H%M%S).dump"
          if pg_dump -Fc -f "$$f.tmp"; then
            mv "$$f.tmp" "$$f" && echo "[backup] wrote $$f ($$(du -h "$$f" | cut -f1))"
          else
            rm -f "$$f.tmp"; echo "[backup] pg_dump failed" >&2
          fi
          find /backups -name 'obelisk-*.dump' -mtime +"$${BACKUP_KEEP_DAYS}" -delete
          sleep 86400
        done
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "2" }

volumes:
  obelisk-db:
  obelisk-backups:
